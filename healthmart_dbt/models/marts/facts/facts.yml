version: 2

models:
  - name: fct_sales
    description: >
      Sales fact table used in the HealthMart star schema.
      The grain is one row per transaction item, meaning one product line
      on one sales transaction.

      This model connects each sales event to the date, customer, store,
      and product dimensions and stores the numeric measures needed for
      sales and profitability analysis.

    columns:
      - name: sales_key
        description: >
          Surrogate key generated from transaction_item_id.
          Serves as the primary key of the sales fact table.
        data_tests:
          - not_null
          - unique

      - name: transaction_item_id
        description: >
          Original business identifier for the transaction line item.
          This identifies the specific product line on the receipt.
        data_tests:
          - not_null
          - unique

      - name: transaction_id
        description: >
          Original transaction or receipt identifier.
          Multiple transaction item rows may share the same transaction_id.

      - name: date_key
        description: >
          Foreign key linked to dim_date.
          Identifies when the sales transaction occurred.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: customer_key
        description: >
          Foreign key linked to dim_customers.
          Identifies the customer associated with the sales transaction.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: product_key
        description: >
          Foreign key linked to dim_products.
          Identifies the product purchased in the transaction line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key

      - name: store_key
        description: >
          Foreign key linked to dim_stores.
          Identifies the store where the sales transaction occurred.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_key